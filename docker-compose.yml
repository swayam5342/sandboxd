version: '3.8'

services:
  sandboxd:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sandboxd-service
    restart: unless-stopped
    ports:
      - "8089:8089"
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN   
      - SYS_CHROOT   
      - SYS_RESOURCE 
      - SYS_PTRACE   
      - NET_ADMIN     
      - SETUID        
      - SETGID       
      - DAC_OVERRIDE 
      - KILL          
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    environment:
      - PORT=:8089
      - LOG_LEVEL=info
      - LOG_JSON=true
      - MAX_CONCURRENT=100
      - NSJAIL_PATH=/usr/sbin/nsjail
      - NSJAIL_BASE_DIR=/tmp/sandboxd-jails
    volumes:
      - sandboxd-jails:/tmp/sandboxd-jails

volumes:
  sandboxd-jails:

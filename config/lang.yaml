languages:
  - id: py3
    name: Python 3
    source_filename: solution.py
    source_filename_strategy: fixed
    check: --version
    run:
      cmd: /usr/bin/python3
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 100

  - id: bash
    name: Bash
    source_filename: solution.sh
    source_filename_strategy: fixed
    check: --version

    run:
      cmd: /bin/bash
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 65536
        max_processes: 50

  - id: node
    name: JavaScript (Node)
    source_filename: solution.js
    source_filename_strategy: fixed
    check: --version

    run:
      cmd: /usr/bin/node
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 262144
        max_processes: 100

  - id: c
    name: C
    source_filename: solution.c
    source_filename_strategy: fixed
    artifact_filename: solution
    artifact_filename_strategy: fixed
    check: --version
    build:
      cmd: /usr/bin/gcc
      args: ["{{flags}}", "-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 10
        memory_kb: 524288
        max_processes: 100
      flag_allowlist:
        - "-O0"
        - "-O1"
        - "-O2"
        - "-O3"
        - "-Wall"
        - "-Wextra"
        - "-Werror"
        - "-std=*"
        - "-lm"
        - "-lpthread"

    run:
      cmd: "{{artifact}}"
      args: []
      limits:
        wall_time_s: 5
        memory_kb: 262144
        max_processes: 64

  - id: cpp
    name: C++
    source_filename: solution.cpp
    source_filename_strategy: fixed
    artifact_filename: solution
    artifact_filename_strategy: fixed
    check: --version

    build:
      cmd: /usr/bin/g++
      args: ["{{flags}}", "-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 10
        memory_kb: 1048576
        max_processes: 100
      flag_allowlist:
        - "-O0"
        - "-O1"
        - "-O2"
        - "-O3"
        - "-Wall"
        - "-Wextra"
        - "-Werror"
        - "-std=*"
        - "-lm"
        - "-lpthread"
    run:
      cmd: "{{artifact}}"
      args: []
      limits:
        wall_time_s: 5
        memory_kb: 524288
        max_processes: 64

  - id: java
    name: Java
    source_filename_strategy: from_request
    artifact_filename_strategy: from_request
    check: --version

    build:
      cmd: /usr/bin/javac
      args:
        [
          "-J-Xmx384m",
          "-J-XX:-UseCompressedClassPointers",
          "{{flags}}",
          "{{source}}",
        ]
      limits:
        wall_time_s: 15
        memory_kb: 524288
        max_processes: 100
      flag_allowlist:
        - "-g"
        - "-nowarn"
        - "-verbose"
        - "-source=*"
        - "-target=*"
    run:
      cmd: /usr/bin/java
      args:
        [
          "-Xmx256m",
          "-XX:-UseCompressedClassPointers",
          "-cp",
          "{{workdir}}",
          "{{artifact_name}}",
        ]
      limits:
        wall_time_s: 10
        memory_kb: 524288
        max_processes: 100

  - id: verilog
    name: Verilog
    source_filename: solution.v
    source_filename_strategy: fixed
    artifact_filename: solution.vvp
    artifact_filename_strategy: fixed
    check: -V

    build:
      cmd: /usr/bin/iverilog
      args: ["{{flags}}", "-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 10
        memory_kb: 262144
        max_processes: 100
      flag_allowlist:
        - "-g2012"
        - "-Wall"
        - "-Winfloop"
        - "-DTEST"

    run:
      cmd: /usr/bin/vvp
      args: ["{{artifact}}"]
      limits:
        wall_time_s: 5
        memory_kb: 131072
        max_processes: 64
  - id: rust
    name: Rust
    source_filename: solution.rs
    source_filename_strategy: fixed
    artifact_filename: solution
    artifact_filename_strategy: fixed
    check: "--version"
    build:
      cmd: /usr/bin/rustc
      args: ["{{flags}}", "-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 30
        memory_kb: 2097152
        max_processes: 100
      flag_allowlist:
        - "-O"
        - "-C*"
        - "-g"
        - "--crate-type=*"
        - "--edition=*"
        - "-A*"
        - "-D*"
        - "-W*"
        - "--cap-lints=*"
        - "--target=*"
        # Security: Explicitly deny unsafe code if desired
        # "-Funsafe-code"
        # "-Z"
        # "--cfg=*"
        # "--extern=*"
        # "-C*"
      flag_denylist:
        - "-C linker=*"
        - "-C linker-flavor=*"
        - "-C link-arg=*"
        - "-C link-args=*"
        - "-C extra-filename=*"
        - "-C save-temps=*"
        - "-C passes=*"
        - "-C llvm-args=*"
        - "-C profile-generate=*"
        - "-C profile-use=*"
    run:
      cmd: "{{artifact}}"
      args: []
      limits:
        wall_time_s: 5
        memory_kb: 262144
        max_processes: 64
